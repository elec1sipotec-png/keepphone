<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Phone Tracking System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{font-family:'Kanit',sans-serif;background:#020617;}
.glow{box-shadow:0 0 30px rgba(34,211,238,.25);}
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
<div class="fixed inset-0 overflow-hidden">
<div class="absolute top-0 left-0 w-96 h-96 bg-cyan-500/20 blur-3xl rounded-full"></div>
<div class="absolute bottom-0 right-0 w-96 h-96 bg-violet-500/20 blur-3xl rounded-full"></div>
</div>

<div class="relative w-full max-w-xl bg-white/10 backdrop-blur-xl border border-cyan-400/30 rounded-3xl glow overflow-hidden">
<div class="bg-gradient-to-r from-cyan-500 via-blue-600 to-violet-600 p-8 text-center text-white">
<i class="fa-solid fa-microchip text-5xl mb-3"></i>
<h1 class="text-3xl font-bold">AI PHONE TRACKING SYSTEM</h1>
<p class="opacity-90">ระบบเบิก-คืนโทรศัพท์อัจฉริยะ</p>
</div>

<form class="p-6 space-y-4">
<input class="w-full p-3 rounded-xl bg-slate-900/60 text-white border border-cyan-500/30" placeholder="Serial Number">
<input class="w-full p-3 rounded-xl bg-slate-900/60 text-white border border-cyan-500/30" placeholder="ชื่อผู้เบิก">
<input class="w-full p-3 rounded-xl bg-slate-900/60 text-white border border-cyan-500/30" placeholder="รุ่นโทรศัพท์">
<textarea class="w-full p-3 rounded-xl bg-slate-900/60 text-white border border-cyan-500/30" rows="3" placeholder="หมายเหตุ"></textarea>

<button class="w-full p-4 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold">
บันทึกข้อมูล
</button>
</form>

<div class="text-center text-cyan-200 text-sm p-4 border-t border-cyan-400/20">
ระบบจัดเก็บข้อมูลแบบ Real-time เชื่อมต่อ Google Sheets
</div>
</div>

<div class="mt-6 text-center text-white">
<div class="inline-block px-6 py-4 rounded-2xl bg-white/10 backdrop-blur-md border border-cyan-400/30">
<div class="text-cyan-300 text-sm">Developed By</div>
<div class="font-bold text-lg">นางสาวศิริกาญจน์ วรรณา</div>
<div class="text-cyan-200 text-sm">โรงเรียนศรีสะเกษวิทยาลัย ม.6</div>
</div>
</div>
</body>
</html>
